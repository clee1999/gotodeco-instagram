name: Publier sur Instagram

on:
  schedule:
    - cron: "*/20 * * * *"     # toutes les 20 minutes (GitHub peut retarder de quelques minutes)
  workflow_dispatch: {}

concurrency:
  group: instagram-publish     # jamais deux publications en parallèle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Publier ce qui est prévu
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: python3 scripts/publish.py

      - name: Enregistrer l'état de la file d'attente
        if: always()
        run: |
          git config user.name  "gotodeco-bot"
          git config user.email "gotodeco-bot@users.noreply.github.com"
          git add -A queue published failed
          git diff --cached --quiet || {
            git commit -m "Publication Instagram $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase && git push
          }
